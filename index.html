  <!-- 主题初始化：必须在样式表之前同步执行，否则深色模式会闪白 -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('blog-theme');
        if (saved) {
          theme = saved === 'dark' ? 'dark' : 'light';
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) { /* 隐私模式下读不到 localStorage，用默认值 */ }
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- 代码高亮：明暗两套主题，靠 disabled 切换（见 js/theme.js） -->

  <script>
    // 让代码高亮主题和页面主题在首屏就保持一致
    (function () {
      if (document.documentElement.getAttribute('data-theme') !== 'dark') return;
      var light = document.getElementById('hljs-light');
      var dark = document.getElementById('hljs-dark');
      if (light) light.disabled = true;
      if (dark) dark.disabled = false;
    })();
  </script>
